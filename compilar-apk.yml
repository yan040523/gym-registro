name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar el APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p salida
          cp app/build/outputs/apk/release/app-release.apk "salida/GymRegistro-v1.0.${{ github.run_number }}.apk"

      - name: Guardar el APK como archivo de la compilación
        uses: actions/upload-artifact@v4
        with:
          name: GymRegistro-APK
          path: salida/*.apk

      - name: Publicar el APK en Releases (enlace de descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Gym Registro v1.0.${{ github.run_number }}
          body: APK listo para instalar en Android 7 o superior.
          files: salida/*.apk
          make_latest: true
